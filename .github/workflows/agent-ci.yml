name: Agent PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build web
        working-directory: web
        run: npm ci && npm run build
      - name: Typecheck API
        working-directory: api
        run: npm ci && npm run typecheck
      - name: Check Docker engine image builds
        run: docker build --progress=plain -f engine/Dockerfile engine
